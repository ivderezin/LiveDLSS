name: iOS

on:
  push:
    branches: [main]
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Lint (swift-format)
        working-directory: apps/ios
        run: xcrun swift-format lint --strict -r App Widgets/Sources Packages/LiveDLSSKit/Sources

      - name: Build package for device
        working-directory: apps/ios/Packages/LiveDLSSKit
        run: xcodebuild -scheme LiveDLSSKit -destination 'generic/platform=iOS' build

      - name: Generate and build app
        working-directory: apps/ios
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          cp Configs/Local.xcconfig.example Configs/Local.xcconfig
          xcodegen generate
          xcodebuild -project LiveDLSS.xcodeproj -scheme LiveDLSS -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
